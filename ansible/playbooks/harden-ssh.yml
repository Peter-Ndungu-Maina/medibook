- name: Harden SSH
  hosts: servers
  become: true
  tasks:
    - name: Install SSH hardening settings
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-hardening.conf
        content: |
          PasswordAuthentication no
          PermitRootLogin no
          MaxAuthTries 3
          X11Forwarding no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
